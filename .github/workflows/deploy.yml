name: Deploy Ismaza

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}

          script: |
            cd /home/u519141514/domains/ismaza.my.id/public_html

            echo "=== SWITCH TO MAIN ==="
            git checkout main

            echo "=== UPDATE CODE ==="
            git pull origin main

            echo "=== CREATE ROOT INDEX ==="
            cp public/index.php index.php

            sed -i "s#__DIR__.'/../storage#__DIR__.'/storage#g" index.php
            sed -i "s#__DIR__.'/../vendor#__DIR__.'/vendor#g" index.php
            sed -i "s#__DIR__.'/../bootstrap#__DIR__.'/bootstrap#g" index.php

            echo "=== CREATE ROOT HTACCESS ==="
            cp public/.htaccess .htaccess

            chmod 644 index.php
            chmod 644 .htaccess

            echo "=== CLEAR LARAVEL CACHE ==="
            php artisan optimize:clear

            echo "=== DEPLOY CHECK ==="
            echo "Commit:"
            git rev-parse --short HEAD

            echo "Branch:"
            git branch --show-current

            echo "Root index:"
            ls -la index.php

            echo "Root htaccess:"
            ls -la .htaccess

            echo "Public index:"
            ls -la public/index.php

            echo "=== DEPLOYMENT SUCCESS ==="